version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cybershield-db
    restart: always
    environment:
      POSTGRES_USER: cybershield_user
      POSTGRES_PASSWORD: cybershield_secure_password_2026
      POSTGRES_DB: cybershield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybershield_user -d cybershield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: cybershield-backend
    restart: always
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      DATABASE_URL: postgresql://cybershield_user:cybershield_secure_password_2026@db:5432/cybershield_db
      SECRET_KEY: ${SECRET_KEY:-cybershield-production-32-chars-secret-key-vault!}
      STORAGE_DIR: /app/storage/evidence
    volumes:
      - evidence_vault:/app/storage/evidence
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: cybershield-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  evidence_vault:
